    internal/annotator/annotator.go:
        summary: 'Orchestrates concurrent file and directory annotation by walking a directory, computing content hashes, and calling an LLM provider to generate summaries stored either inline (as comment headers) or in a shared index file. The `Run` function fans out work across a semaphore-bounded goroutine pool in two phases: Phase 1 processes files with hash-based change detection and inline↔index migration (`StatusCleaned`, `StatusMigrated`), while Phase 2 (index mode only) aggregates file summaries into directory-level summaries. `processFile` handles per-file logic including dry-run support and writing updated content or index entries, while `processDirectory` synthesizes file summaries via LLM to generate collective directory descriptions. Inline blocks embedded in source files are always treated as the source of truth: in index mode they are promoted to the index without LLM calls; in inline mode they override any migration index entry to prevent stale hashes from triggering repeated LLM calls.'
